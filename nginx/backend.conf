server {
    listen 80;
    listen [::]:80;
    server_name back-youstream.alltime.in.th;

    # รองรับการอัปโหลดไฟล์วิดีโอขนาดใหญ่ (ตามที่ SRS ระบุไว้สูงสุด 500MB)
    client_max_body_size 500M;

    # RESTful API & Media Streaming Endpoint
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # รองรับ Video Streaming (ปิด buffering เพื่อส่ง chunk ทันที)
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO Real-time WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ยืดเวลา timeout เพื่อให้ websocket ค้างเชื่อมต่อได้ยาวนาน
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
