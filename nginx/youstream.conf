# ==============================================================================
# 1. Frontend: youstream.alltime.in.th -> Next.js (Port 5001)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name youstream.alltime.in.th;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 2. Backend: back-youstream.alltime.in.th -> Hono / Bun (Port 5002)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name back-youstream.alltime.in.th;

    # รองรับการอัปโหลดไฟล์วิดีโอขนาดใหญ่ (ตาม SRS สูงสุด 500MB)
    client_max_body_size 500M;

    # RESTful API & Media Streaming Endpoint
    location / {
        proxy_pass http://127.0.0.1:5002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ปิด buffering สำหรับการสตรีมวิดีโอ (HTTP Range 206)
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Socket.IO Real-time WebSockets
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ขยายเวลา timeout สำหรับการเชื่อมต่อ WebSocket ระยะยาว
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

